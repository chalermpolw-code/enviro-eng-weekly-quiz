<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Environmental Engineering Weekly</title>
  <meta name="description" content="Five environmental engineering questions every Sunday, with a peer discussion forum." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Hero -->
  <header class="hero" id="top">
    <div class="hero-inner">
      <p class="eyebrow" id="site-eyebrow">Environmental Engineering</p>
      <h1 class="hero-title">Five questions.<br /><span>Every Sunday.</span></h1>

      <div class="level-pick" role="group" aria-label="Choose a level">
        <button type="button" class="level-btn" data-category="easy">
          <span class="level-name">Easy</span>
          <span class="level-tag" data-tagline="easy"></span>
        </button>
        <button type="button" class="level-btn" data-category="intermediate">
          <span class="level-name">Intermediate</span>
          <span class="level-tag" data-tagline="intermediate"></span>
        </button>
        <button type="button" class="level-btn" data-category="hard">
          <span class="level-name">Hard</span>
          <span class="level-tag" data-tagline="hard"></span>
        </button>
      </div>
    </div>
    <a class="scroll-cue" href="#quiz" aria-label="Go to questions"><span></span></a>
  </header>

  <!-- Quiz -->
  <main class="quiz" id="quiz">
    <div class="quiz-bar">
      <div class="quiz-bar-left">
      <button type="button" class="icon-btn home-btn" id="home-btn" aria-label="Back to start" title="Back to start">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <div class="seg" role="tablist" aria-label="Level">
        <button type="button" class="category-tab" role="tab" data-category="easy">Easy</button>
        <button type="button" class="category-tab" role="tab" data-category="intermediate">Intermediate</button>
        <button type="button" class="category-tab" role="tab" data-category="hard">Hard</button>
      </div>
      </div>

      <div class="quiz-bar-right">
        <label class="sr-only" for="week-select">Week</label>
        <select id="week-select" class="week-select"></select>
        <span class="score" id="score-display" aria-live="polite">0/5</span>
      </div>
    </div>

    <div class="progress" id="progress-dots" role="group" aria-label="Questions"></div>

    <section class="stage" id="question-stage" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <span id="footer-text">Free · open access</span>
    <a href="author.html">Instructor</a>
  </footer>

  <!-- Discussion drawer -->
  <div class="backdrop" id="forum-backdrop" hidden></div>
  <aside class="drawer" id="forum-drawer" aria-label="Discussion" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <h2 class="drawer-title">Discussion</h2>
        <span class="mode-badge" id="forum-mode-badge"></span>
      </div>
      <button type="button" class="icon-btn" id="forum-close" aria-label="Close discussion">&times;</button>
    </div>

    <div id="forum-giscus-container" class="giscus-wrap" hidden></div>

    <div id="forum-standard-ui" class="drawer-body">
      <div class="chips" id="forum-filter-bar" role="group" aria-label="Filter by question"></div>

      <p class="local-note" id="forum-local-notice" hidden>Local mode — posts stay in this browser.</p>

      <div class="posts" id="forum-posts-list"></div>

      <form class="post-form" id="forum-form" autocomplete="off">
        <div class="form-row">
          <label class="sr-only" for="forum-question-select">Question</label>
          <select id="forum-question-select" class="field field-q">
            <option value="1">Q1</option>
            <option value="2">Q2</option>
            <option value="3">Q3</option>
            <option value="4">Q4</option>
            <option value="5">Q5</option>
          </select>
          <label class="sr-only" for="forum-author-input">Your name</label>
          <input type="text" id="forum-author-input" class="field" placeholder="Your name" maxlength="60" required />
          <label class="sr-only" for="forum-role-input">Role (optional)</label>
          <input type="text" id="forum-role-input" class="field" placeholder="Role (optional)" maxlength="60" />
        </div>
        <label class="sr-only" for="forum-text-input">Explanation</label>
        <textarea id="forum-text-input" class="field field-text" placeholder="Explain your reasoning…" maxlength="1500" required></textarea>
        <div class="form-actions">
          <span class="form-status" id="forum-form-status" aria-live="polite"></span>
          <button type="submit" class="btn btn-primary" id="forum-submit-btn">Post</button>
        </div>
      </form>
    </div>
  </aside>

  <script src="config.js"></script>
  <script src="data/questions.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
